name: Docker Image CI

on:
  push:
    branches: [ "test_CI_1" ]
  pull_request:
    branches: [ "test_CI_1" ]

jobs:

  build:

    runs-on: euleros-2.10.1

    steps:
    - uses: checkout-action@0.0.1
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)